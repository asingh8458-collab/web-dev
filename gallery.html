<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <style>
      /* Centers all elements horizontally on the web page */
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }

      .title {
        margin-top: 60px;
        margin-bottom: 30px;
        font-size: 2.5rem;
        color: #333;
        text-align: center;
      }

      .image-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 950px;
        width: 90%;
        margin-bottom: 60px;
      }

      .image-container img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Images</h1>

    <!-- Centered Image Container (3 images per row, 12 total) -->
    <div class="image-container">
      <!-- Row 1 -->
      <img src="images/sunflower.jpg" alt="Image One">
        <img src="images/swyambu.jpg" alt="Image Two">
        <img src="images/krishna.jpg" alt="Image Three">
      
      <!-- Row 2 -->
       <img src="images/mount.jpg" alt="Image Four">
        <img src="images/bhairav.jpg" alt="Image Five">
        <img src="images/temple.jpg" alt="Image Six">
        
        <!-- Row 3 -->
         <img src="images/village.jpg" alt="Image Six">
        <img src="images/chauri.jpg" alt="Image Six">
        <img src="images/patan.jpg" alt="Image Six">

      <!-- Row 4  -->
      <img src="images/ocean.webp" alt="Image Six">
        <img src="images/mountain.jpg" alt="Image Six">
        <img src="images/scene.avif" alt="Image Six">
    </div>
  </body>
</html>
