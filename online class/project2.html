<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Date Me?</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        h1 {
            font-size: 28px;
            color: #d63031;
            margin-bottom: 20px;
        }

        .gif-container img {
            width: 180px;
            height: 180px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            z-index: 2;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #27ae60;
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            transition: 0.15s ease-out;
            z-index: 10;
        }

        /* Success Message Styling */
        #responseMessage {
            display: none;
            font-size: 24px;
            color: #27ae60;
            font-weight: bold;
            margin-top: 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXU2ZjBseTZwd3E0NW9jZW4xeHdqdzJicWhjczYycms0cGp5ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1dkp22TqwPqp20C/giphy.gif" alt="Cute asking GIF">
        </div>

        <h1 id="question">Will you go on a date with me? 💖</h1>

        <div class="btn-container" id="btnContainer">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <div id="responseMessage">
            Yay! It's a date! Pick you up at 7:00 PM! 🥰🎉
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const mainGif = document.getElementById("mainGif");
        const question = document.getElementById("question");
        const btnContainer = document.getElementById("btnContainer");
        const responseMessage = document.getElementById("responseMessage");

        let yesScale = 1;

        // Make the "No" button dodge and run away dynamically
        noBtn.addEventListener("mouseover", function() {
            // Calculate random screen position within padded viewport boundary
            const padding = 100;
            const randomX = Math.floor(Math.random() * (window.innerWidth - padding * 2)) + padding;
            const randomY = Math.floor(Math.random() * (window.innerHeight - padding * 2)) + padding;

            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";

            // Increase "Yes" button size slightly each time "No" is hovered
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        // When "Yes" is clicked
        yesBtn.addEventListener("click", function() {
            // Trigger confetti
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });

            // Switch to happy gif and success text
            mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGx2cmZtbDFnOHYzeDlhZ3BqYmpvMG9icTVuMXZ2NGsydTBodndzeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/T8XpL0ak42TQD8A33i/giphy.gif";
            question.innerText = "YAYYY! 💖";
            
            // Hide buttons and show happy text
            btnContainer.style.display = "none";
            responseMessage.style.display = "block";
        });
    </script>

</body>
</html>
